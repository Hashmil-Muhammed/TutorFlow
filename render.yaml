services:
  - type: web
    name: tutorflow-server
    env: node
    rootDir: server
    buildCommand: npm install && npx prisma generate
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: "file:./dev.db" # In a real production environment on Render, switch to PostgreSQL
      - key: JWT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
